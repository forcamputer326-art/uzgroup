<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Telegram Chat Realtime</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;background:#f4f4f5;color:#111;min-height:100vh}
button,input{font:inherit}
.hidden{display:none!important}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{width:min(420px,calc(100% - 32px));background:#fff;border-radius:16px;padding:40px 36px;box-shadow:0 8px 30px #00000012;text-align:center}
.logo{width:86px;height:86px;margin:0 auto 22px}
.logo svg{width:100%;height:100%}
h1{font-size:26px;margin-bottom:8px}
.sub{color:#707579;font-size:14px;line-height:21px;margin-bottom:25px}
.input{width:100%;height:50px;border:1px solid #d8dde2;border-radius:10px;padding:0 14px;margin-bottom:11px;outline:0}
.input:focus{border-color:#3390ec;box-shadow:0 0 0 2px #3390ec1c}
.btn{width:100%;height:50px;border:0;border-radius:10px;background:#3390ec;color:#fff;font-weight:700;cursor:pointer;margin-top:5px}
.btn:hover{background:#2b83d9}
.link{display:block;color:#3390ec;font-size:14px;font-weight:600;margin-top:19px;cursor:pointer}
.error{display:none;color:#e53935;text-align:left;font-size:13px;margin:0 0 9px}

.app{height:100vh;display:flex;overflow:hidden}
.sidebar{width:330px;background:#fff;border-right:1px solid #e1e4e7;display:flex;flex-direction:column}
.side-head{height:64px;padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #eee}
.avatar{width:40px;height:40px;border-radius:50%;background:#3390ec;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;background-size:cover;background-position:center;flex-shrink:0}
.me{flex:1;overflow:hidden}
.me b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me span{font-size:12px;color:#707579}
.search{margin:12px;height:42px;border:0;background:#f1f3f5;border-radius:9px;padding:0 13px;outline:0}
.chat-list{overflow:auto;flex:1}
.chat{padding:12px 16px;display:flex;gap:12px;cursor:pointer;align-items:center}
.chat:hover,.chat.active{background:#e9f3ff}
.chat-info{flex:1;overflow:hidden}
.chat-info b{display:block;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-info span{font-size:13px;color:#707579;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

.main{flex:1;display:flex;flex-direction:column;background:#e7edf3}
.top{height:64px;background:#fff;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid #ddd}
.top .avatar{margin-right:11px}
.top b{font-size:15px}
.top small{display:block;color:#707579;margin-top:2px}
.messages{flex:1;padding:24px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.empty{text-align:center;color:#707579;margin:auto}
.bubble{max-width:min(70%,520px);padding:9px 12px;border-radius:13px;background:#fff;align-self:flex-start;box-shadow:0 1px 1px #0000000b;position:relative;cursor:pointer;user-select:none}
.bubble.mine{align-self:flex-end;background:#d9fdd3}
.bubble small{display:block;text-align:right;color:#707579;font-size:10px;margin-top:4px}
.bubble .sender-name{font-size:11px;font-weight:bold;color:#3390ec;margin-bottom:3px;display:block}
.composer{padding:12px;background:#fff;display:flex;gap:9px}
.composer input{flex:1;border:0;background:#f1f3f5;border-radius:22px;padding:0 16px;outline:0}
.send{width:48px;height:48px;border:0;border-radius:50%;background:#3390ec;color:#fff;cursor:pointer;font-size:18px}
.btn-icon{border:0;background:transparent;color:#3390ec;cursor:pointer;font-size:14px;padding:5px}

/* Modal Sozlamalar */
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:#00000066;display:flex;align-items:center;justify-content:center;z-index:100}
.modal-content{background:#fff;border-radius:16px;padding:24px;width:min(400px,90%);box-shadow:0 10px 25px rgba(0,0,0,0.2)}
.modal-content h2{margin-bottom:15px;font-size:20px}
.modal-content label{display:block;font-size:12px;color:#707579;margin-top:10px;margin-bottom:4px;text-align:left}

@media(max-width:700px){
.sidebar{width:100%}.main{display:none}.sidebar.mobile-hide{display:none}
.app.show-chat .sidebar{display:none}.app.show-chat .main{display:flex}
.top{padding-left:12px}.messages{padding:14px}.bubble{max-width:85%}
.back-mobile{display:block!important;border:0;background:transparent;margin-right:10px;font-size:20px;cursor:pointer}
.card{padding:32px 24px}
}
.back-mobile{display:none}
</style>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<!-- Kirish va Ro'yxatdan o'tish -->
<div id="auth" class="auth">
  <div class="card">
    <div class="logo"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#3390ec"/><path d="M22 48.5L73.5 28.8C76.1 27.8 78.4 29.4 77.5 32.2L68.6 70.8C67.9 73.8 66.1 74.5 63.6 73.1L49.2 62.5L42.2 69.2C41.4 70 40.8 70.7 39.2 70.7L40.2 56.1L66.7 34.6C67.9 33.6 66.4 33.1 64.8 34.1L32.1 54.8L18.1 50.4C15.1 49.5 15.1 47.4 22 48.5Z" fill="#fff"/></svg></div>
    <h1 id="authTitle">Telegram</h1>
    <p id="authSub" class="sub">Username orqali xavfsiz va sodda kirish.</p>
    
    <div id="loginBox">
      <input id="loginUser" class="input" placeholder="Username">
      <input id="loginPass" class="input" type="password" placeholder="Parol">
      <div id="loginErr" class="error">Username yoki parol noto‘g‘ri.</div>
      <button class="btn" onclick="login()">Akkountga kirish</button>
      <div class="link" onclick="switchAuth()">Akkount yaratish</div>
    </div>
    
    <div id="regBox" class="hidden">
      <input id="regName" class="input" placeholder="Ism">
      <input id="regUser" class="input" placeholder="Username">
      <input id="regPass" class="input" type="password" placeholder="Parol">
      <div id="regErr" class="error">Barcha maydonlarni to‘ldiring.</div>
      <button class="btn" onclick="register()">Akkount yaratish</button>
      <div class="link" onclick="switchAuth()">Akkountga kirish</div>
    </div>
  </div>
</div>

<!-- Asosiy Dastur -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="side-head">
      <div id="myAvatar" class="avatar">U</div>
      <div class="me">
        <b id="myName">User</b>
        <span id="myUsername">@user</span>
      </div>
      <button class="btn-icon" onclick="openSettings()">⚙️</button>
      <button class="btn-icon" style="color:#e53935" onclick="logout()">🚪</button>
    </div>
    <input class="search" placeholder="Qidirish..." oninput="filterChats(this.value)">
    <div id="chatList" class="chat-list">
      <!-- Chatlar dynamic yuklanadi -->
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <button class="back-mobile" onclick="backChats()">‹</button>
      <div id="chatAvatar" class="avatar">T</div>
      <div>
        <b id="chatTitle">Umumiy Chat</b>
        <small id="chatStatus">Barcha foydalanuvchilar</small>
      </div>
    </header>
    <div id="messages" class="messages"></div>
    <div class="composer">
      <input id="messageInput" placeholder="Xabar yozing..." onkeydown="if(event.key==='Enter')sendMessage()">
      <button class="send" onclick="sendMessage()">➤</button>
    </div>
  </main>
</div>

<!-- Sozlamalar Modali -->
<div id="settingsModal" class="modal hidden">
  <div class="modal-content">
    <h2>Profil Sozlamalari</h2>
    <label>Ism:</label>
    <input id="setImgName" class="input" placeholder="Ismingiz">
    <label>Profil Rasmi URL (Havola):</label>
    <input id="setImgUrl" class="input" placeholder="https://example.com/photo.jpg">
    <label>Yoki kompyuterdan/telefondan rasm tanlang:</label>
    <input type="file" id="setImgFile" accept="image/*" class="input" style="padding:10px">
    <button class="btn" onclick="saveSettings()">Saqlash</button>
    <button class="btn" style="background:#ccc;margin-top:8px" onclick="closeSettings()">Yopish</button>
  </div>
</div>

<script>
// Firebase Sozlamalari (Bepul tayyor ochiq baza yoqilgan)
const firebaseConfig = {
  databaseURL: "https://telegram-clone-js-default-rtdb.firebaseio.com/"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentUser = null;
let currentChat = { id: 'global', name: 'Umumiy Chat', type: 'global', avatar: '' };

const $ = id => document.getElementById(id);

function switchAuth(){
  $('loginBox').classList.toggle('hidden');$('regBox').classList.toggle('hidden');
  $('authTitle').textContent =$('regBox').classList.contains('hidden') ? 'Telegram' : 'Akkount yaratish';
  $('authSub').textContent =$('regBox').classList.contains('hidden') ? 'Username orqali xavfsiz va sodda kirish.' : 'Yangi akkount yarating.';
}

function register(){
  let n = $('regName').value.trim(),
      u = $('regUser').value.trim().replace(/^@/,'').toLowerCase(),
      p = $('regPass').value;
  if(!n || !u || !p){ showErr('regErr', 'Barcha maydonlarni to‘ldiring.'); return; }

  db.ref('users/' + u).once('value', snapshot => {
    if(snapshot.exists()){
      showErr('regErr', 'Bu username band.');
    } else {
      let userData = { name: n, username: u, password: p, avatar: '' };
      db.ref('users/' + u).set(userData);
      currentUser = userData;
      localStorage.setItem('tg_session', u);
      openApp();
    }
  });
}

function login(){
  let u = $('loginUser').value.trim().replace(/^@/,'').toLowerCase(),
      p = $('loginPass').value;
  db.ref('users/' + u).once('value', snapshot => {
    let user = snapshot.val();
    if(user && user.password === p){
      currentUser = user;
      localStorage.setItem('tg_session', u);
      openApp();
    } else {
      showErr('loginErr', 'Username yoki parol noto‘g‘ri.');
    }
  });
}

function showErr(id, txt){
  $(id).textContent = txt;
  $(id).style.display = 'block';
}

function openApp(){
  $('auth').classList.add('hidden');$('app').classList.remove('hidden');
  updateMyProfileUI();
  listenUsers();
  openChat('global', 'Umumiy Chat', 'global', '');
}

function updateMyProfileUI(){
  $('myName').textContent = currentUser.name;
  $('myUsername').textContent = '@' + currentUser.username;
  setAvatarUI($('myAvatar'), currentUser.avatar, currentUser.name);
}

function setAvatarUI(el, url, name){
  if(url){
    el.style.backgroundImage = `url('${url}')`;
    el.textContent = '';
  } else {
    el.style.backgroundImage = 'none';
    el.textContent = (name || 'U')[0].toUpperCase();
  }
}

function logout(){
  localStorage.removeItem('tg_session');
  location.reload();
}

function listenUsers(){
  db.ref('users').on('value', snapshot => {
    let users = snapshot.val() || {};
    let chatList = $('chatList');
    chatList.innerHTML = `
      <div class="chat ${currentChat.id==='global'?'active':''}" onclick="openChat('global', 'Umumiy Chat', 'global', '')">
        <div class="avatar" style="background:#3390ec">👥</div>
        <div class="chat-info"><b>Umumiy Chat</b><span>Barcha foydalanuvchilar</span></div>
      </div>
    `;
    
    Object.keys(users).forEach(u => {
      if(u !== currentUser.username){
        let usr = users[u];
        let chatDiv = document.createElement('div');
        chatDiv.className = `chat ${currentChat.id===u?'active':''}`;
        chatDiv.onclick = () => openChat(u, usr.name, 'private', usr.avatar);
        chatDiv.innerHTML = `
          <div class="avatar" id="av_${u}"></div>
          <div class="chat-info"><b>${usr.name}</b><span>@${usr.username}</span></div>
        `;
        chatList.appendChild(chatDiv);
        setAvatarUI(chatDiv.querySelector('.avatar'), usr.avatar, usr.name);
      }
    });
  });
}

function openChat(id, name, type, avatar){
  currentChat = { id, name, type, avatar };
  $('chatTitle').textContent = name;
  $('chatStatus').textContent = type === 'global' ? 'Barcha foydalanuvchilar' : '@' + id;
  setAvatarUI($('chatAvatar'), avatar, name);$('app').classList.add('show-chat');
  loadMessages();
}

function backChats(){ $('app').classList.remove('show-chat'); }

function getChatKey(){
  if(currentChat.type === 'global') return 'global';
  let ids = [currentUser.username, currentChat.id].sort();
  return 'private_' + ids[0] + '_' + ids[1];
}

let messagesRef = null;
function loadMessages(){
  if(messagesRef) messagesRef.off();
  let key = getChatKey();
  let box = $('messages');
  box.innerHTML = '';

  messagesRef = db.ref('messages/' + key);
  messagesRef.on('value', snapshot => {
    box.innerHTML = '';
    let msgs = snapshot.val() || {};
    let keys = Object.keys(msgs);
    if(!keys.length){
      box.innerHTML = '<div class="empty">Bu chat bo‘sh. Birinchi xabarni yozing!</div>';
      return;
    }
    keys.forEach(msgId => {
      let m = msgs[msgId];
      let isMine = m.sender === currentUser.username;
      let b = document.createElement('div');
      b.className = 'bubble' + (isMine ? ' mine' : '');
      
      let html = '';
      if(currentChat.type === 'global' && !isMine){
        html += `<span class="sender-name">${m.senderName || m.sender}</span>`;
      }
      html += `${escapeHtml(m.text)}<small>${m.time}${m.edited ? ' (tahrirlandi)' : ''}</small>`;
      b.innerHTML = html;

      // Xabarni tahrirlash / o'chirish uchun kontekst menyusi
      b.oncontextmenu = (e) => {
        e.preventDefault();
        if(isMine){
          manageMessage(key, msgId, m.text);
        }
      };

      box.appendChild(b);
    });
    box.scrollTop = box.scrollHeight;
  });
}

function manageMessage(chatKey, msgId, oldText){
  let act = prompt("Xabarni amali:\n1 - Tahrirlash\n2 - O'chirish", "1");
  if(act === "1"){
    let newTxt = prompt("Yangi xabarni kiriting:", oldText);
    if(newTxt && newTxt.trim() !== ""){
      db.ref(`messages/${chatKey}/${msgId}`).update({
        text: newTxt.trim(),
        edited: true
      });
    }
  } else if(act === "2"){
    if(confirm("Xabar o'chirilsinmi?")){
      db.ref(`messages/${chatKey}/${msgId}`).remove();
    }
  }
}

function sendMessage(){
  let input = $('messageInput'), text = input.value.trim();
  if(!text) return;
  let t = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  let key = getChatKey();

  db.ref('messages/' + key).push({
    sender: currentUser.username,
    senderName: currentUser.name,
    text: text,
    time: t
  });

  input.value = '';
}

// Sozlamalar funksiyalari
function openSettings(){
  $('setImgName').value = currentUser.name;
  $('setImgUrl').value = currentUser.avatar \vert{}\vert{} '';$('settingsModal').classList.remove('hidden');
}

function closeSettings(){ $('settingsModal').classList.add('hidden'); }

function saveSettings(){
  let newName = $('setImgName').value.trim();
  let url = $('setImgUrl').value.trim();
  let fileInput = $('setImgFile');

  if(!newName) return;

  let updateProfile = (imgData) => {
    currentUser.name = newName;
    currentUser.avatar = imgData;
    db.ref('users/' + currentUser.username).update({
      name: newName,
      avatar: imgData
    });
    updateMyProfileUI();
    closeSettings();
  };

  if(fileInput.files && fileInput.files[0]){
    let reader = new FileReader();
    reader.onload = function(e){
      updateProfile(e.target.result);
    };
    reader.readAsDataURL(fileInput.files[0]);
  } else {
    updateProfile(url);
  }
}

function filterChats(q){
  q = q.toLowerCase();
  document.querySelectorAll('.chat').forEach(c => {
    c.style.display = c.textContent.toLowerCase().includes(q) ? 'flex' : 'none';
  });
}

function escapeHtml(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Avto kirish
(function(){
  let s = localStorage.getItem('tg_session');
  if(s){
    db.ref('users/' + s).once('value', snapshot => {
      let user = snapshot.val();
      if(user){
        currentUser = user;
        openApp();
      }
    });
  }
})();
</script>
</body>
</html>
