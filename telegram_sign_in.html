<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram - Sign In</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{min-height:100vh;background:#f4f4f5;font-family:"Segoe UI",Roboto,-apple-system,BlinkMacSystemFont,Arial,sans-serif;color:#111;display:flex;align-items:center;justify-content:center}
        .login-container{width:100%;max-width:420px;padding:24px}
        .login-card{width:100%;background:#fff;border-radius:16px;padding:42px 38px 36px;box-shadow:0 8px 30px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.04);text-align:center}
        .logo{width:92px;height:92px;margin:0 auto 24px;display:flex;align-items:center;justify-content:center}
        .logo svg{width:92px;height:92px;display:block}
        .title{font-size:27px;line-height:34px;font-weight:700;color:#111;margin-bottom:8px;letter-spacing:-.3px}
        .subtitle{max-width:290px;margin:0 auto 28px;font-size:15px;line-height:21px;color:#707579}
        .field{width:100%;margin-bottom:16px;text-align:left}
        .field-label{display:block;margin-bottom:7px;padding-left:3px;color:#707579;font-size:13px;font-weight:500}
        select,.phone-input{width:100%;height:52px;border:1px solid #d9dde1;border-radius:10px;background:#fff;color:#111;font-family:inherit;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
        select{padding:0 14px;cursor:pointer}
        .phone-wrapper{display:flex;align-items:center;width:100%;height:52px;border:1px solid #d9dde1;border-radius:10px;overflow:hidden;background:#fff;transition:border-color .2s,box-shadow .2s}
        .phone-wrapper:focus-within,select:focus{border-color:#3390ec;box-shadow:0 0 0 2px rgba(51,144,236,.12)}
        .country-code{height:100%;min-width:76px;padding:0 10px 0 14px;display:flex;align-items:center;color:#111;font-size:16px;border-right:1px solid #e1e4e7;background:#fff}
        .phone-input{height:100%;border:none;border-radius:0;padding:0 14px;box-shadow:none}
        .phone-input:focus{outline:none;box-shadow:none}
        .phone-input::placeholder{color:#a0a5a9}
        .continue-btn{width:100%;height:52px;margin-top:8px;border:none;border-radius:10px;background:#3390ec;color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:background .2s,transform .1s}
        .continue-btn:hover{background:#2b83d9}
        .continue-btn:active{transform:scale(.985)}
        .qr-link{display:inline-block;margin-top:22px;color:#3390ec;text-decoration:none;font-size:15px;font-weight:600;cursor:pointer}
        .qr-link:hover{text-decoration:underline}
        .terms{margin:25px auto 0;max-width:300px;color:#707579;font-size:12px;line-height:18px}
        .terms a{color:#3390ec;text-decoration:none}
        .terms a:hover{text-decoration:underline}
        .error{display:none;margin-top:8px;color:#e53935;font-size:13px;text-align:left}
        @media(max-width:500px){
            body{align-items:flex-start;padding-top:45px}
            .login-container{padding:16px}
            .login-card{padding:34px 24px 30px;border-radius:14px}
            .logo,.logo svg{width:82px;height:82px}
            .logo{margin-bottom:20px}
            .title{font-size:24px;line-height:31px}
            .subtitle{font-size:14px;line-height:20px;margin-bottom:24px}
        }
        @media(max-width:350px){
            body{padding-top:20px}
            .login-card{padding:28px 18px}
            .title{font-size:22px}
            .country-code{min-width:68px;padding-left:10px}
        }
    </style>
</head>
<body>
<main class="login-container">
    <section class="login-card">
        <div class="logo">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Telegram style logo">
                <circle cx="50" cy="50" r="50" fill="#3390ec"/>
                <path d="M22 48.5L73.5 28.8C76.1 27.8 78.4 29.4 77.5 32.2L68.6 70.8C67.9 73.8 66.1 74.5 63.6 73.1L49.2 62.5L42.2 69.2C41.4 70 40.8 70.7 39.2 70.7L40.2 56.1L66.7 34.6C67.9 33.6 66.4 33.1 64.8 34.1L32.1 54.8L18.1 50.4C15.1 49.5 15.1 47.4 22 48.5Z" fill="#fff"/>
            </svg>
        </div>
        <h1 class="title">Sign in to Telegram</h1>
        <p class="subtitle">Please enter your phone number to log in to your account.</p>

        <div class="field">
            <label class="field-label" for="country">Country</label>
            <select id="country">
                <option value="+998" selected>Uzbekistan</option>
                <option value="+7">Kazakhstan</option>
                <option value="+90">Türkiye</option>
                <option value="+1">United States</option>
                <option value="+44">United Kingdom</option>
                <option value="+49">Germany</option>
                <option value="+33">France</option>
                <option value="+91">India</option>
                <option value="+86">China</option>
                <option value="+81">Japan</option>
            </select>
        </div>

        <div class="field">
            <label class="field-label" for="phone">Phone number</label>
            <div class="phone-wrapper">
                <div class="country-code" id="countryCode">+998</div>
                <input id="phone" class="phone-input" type="tel" inputmode="numeric" autocomplete="tel" placeholder="Phone number">
            </div>
            <div class="error" id="error">Please enter your phone number.</div>
        </div>

        <button type="button" class="continue-btn" id="continueBtn">NEXT</button>
        <a href="#" class="qr-link" id="qrLink">Log in by QR Code</a>
        <p class="terms">By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</p>
    </section>
</main>

<script>
const countrySelect=document.getElementById("country");
const countryCode=document.getElementById("countryCode");
const phoneInput=document.getElementById("phone");
const continueBtn=document.getElementById("continueBtn");
const error=document.getElementById("error");
const qrLink=document.getElementById("qrLink");

countrySelect.addEventListener("change",function(){countryCode.textContent=this.value});
continueBtn.addEventListener("click",function(){
    const phone=phoneInput.value.trim();
    if(phone===""){error.style.display="block";phoneInput.focus();return}
    error.style.display="none";
    alert("Telefon raqami: "+countryCode.textContent+" "+phone);
});
phoneInput.addEventListener("input",function(){
    this.value=this.value.replace(/\D/g,"");
    if(this.value!=="")error.style.display="none";
});
qrLink.addEventListener("click",function(event){
    event.preventDefault();
    alert("QR Code orqali kirish funksiyasi keyingi bosqichda qo‘shiladi.");
});
</script>
</body>
</html>
