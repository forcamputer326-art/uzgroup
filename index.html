<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mening saytim</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
        }
        .box {
            margin: 120px auto;
            width: 350px;
            padding: 40px;
            background: rgba(255,255,255,0.15);
            border-radius: 20px;
        }
        h1 { font-size: 40px; }
        p { font-size: 18px; }
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #667eea;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="box">
        <h1>Salom 👋</h1>
        <p>Bu mening birinchi chiroyli saytim!</p>
        <button onclick="alert('Xush kelibsiz! 🎉')">Bos meni</button>
    </div>
</body>
</html>
