<!DOCTYPE html>
<!-- saved from url=(0033)https://eighta-chat.onrender.com/ -->
<html lang="uz"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telegram Web Ultra Pro</title>
  <link rel="stylesheet" href="./Telegram Web Ultra Pro_files/all.min.css">
  <style>
    :root {
      --bg-app: #0e1621;
      --bg-sidebar: #17212b;
      --bg-input: #0e1621;
      --bg-msg-in: #182533;
      --bg-msg-out: #2b5278;
      --text-main: #ffffff;
      --text-sub: #7f91a4;
      --accent: #5288c1;
      --border-color: #0e1621;
      --chat-pattern: radial-gradient(#1e2c3a 1px, transparent 0);
    }

    body.light-mode {
      --bg-app: #e6ebeef0;
      --bg-sidebar: #ffffff;
      --bg-input: #f1f1f1;
      --bg-msg-in: #ffffff;
      --bg-msg-out: #eeffde;
      --text-main: #000000;
      --text-sub: #707579;
      --accent: #3390ec;
      --border-color: #e4e4e4;
      --chat-pattern: radial-gradient(#cbd5e1 1px, transparent 0);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100dvh; overflow: hidden; background-color: var(--bg-app); color: var(--text-main); }

    .telegram-app { display: flex; width: 100vw; height: 100dvh; background: var(--bg-sidebar); overflow: hidden; position: relative; }

    /* Sidebar */
    .sidebar { width: 350px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; flex-shrink: 0; transition: transform 0.3s ease; height: 100%; }
    .sidebar-header { padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); height: 56px; gap: 8px; }
    
    .my-profile-btn { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 8px; border-radius: 8px; transition: 0.2s; }
    .my-profile-btn:hover { background: rgba(255,255,255,0.05); }

    /* Search Box */
    .search-container { padding: 8px 12px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border-color); }
    .search-box { display: flex; align-items: center; background: var(--bg-input); border-radius: 18px; padding: 6px 12px; gap: 8px; }
    .search-box input { background: transparent; border: none; outline: none; color: var(--text-main); font-size: 14px; width: 100%; }
    .search-box i { color: var(--text-sub); font-size: 14px; }

    .chats-list { flex: 1; overflow-y: auto; }
    .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; transition: 0.2s; border-bottom: 1px solid var(--border-color); }
    .chat-item:hover, .chat-item.active { background: rgba(82, 136, 193, 0.15); }
    
    .avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; color: #fff; text-transform: uppercase; flex-shrink: 0; background-size: cover; background-position: center; }
    .avatar.small { width: 36px; height: 36px; font-size: 14px; }
    
    .chat-info { flex: 1; overflow: hidden; }
    .chat-info .name { font-size: 15px; font-weight: 600; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }
    .chat-info .type-tag { font-size: 10px; background: var(--accent); color: #fff; padding: 2px 6px; border-radius: 4px; }
    .chat-info .status { font-size: 13px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }

    /* Chat Area */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-app); position: relative; height: 100%; }
    .chat-header { padding: 10px 16px; background: var(--bg-sidebar); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); height: 56px; }
    .chat-header-info { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .chat-header .title { font-size: 16px; font-weight: 600; }
    .chat-header .sub { font-size: 12px; color: var(--text-sub); }
    .back-btn { display: none; background: none; border: none; color: var(--text-sub); font-size: 20px; cursor: pointer; margin-right: 8px; }

    /* Messages */
    .messages-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background-image: var(--chat-pattern); background-size: 16px 16px; transition: 0.3s; }
    .msg { max-width: 75%; padding: 8px 12px; border-radius: 12px 12px 12px 0px; background: var(--bg-msg-in); color: var(--text-main); align-self: flex-start; position: relative; word-break: break-word; font-size: 14.5px; box-shadow: 0 1px 2px rgba(0,0,0,0.15); user-select: none; }
    .msg.me { align-self: flex-end; background: var(--bg-msg-out); border-radius: 12px 12px 0px 12px; }
    .msg-author { font-size: 12px; font-weight: bold; color: var(--accent); margin-bottom: 3px; }
    .msg.me .msg-author { display: none; }
    
    .msg-meta { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--text-sub); float: right; margin-top: 4px; margin-left: 10px; }
    .edited-mark { font-style: italic; opacity: 0.8; }

    .reply-quote { border-left: 3px solid var(--accent); background: rgba(0,0,0,0.12); padding: 4px 8px; margin-bottom: 6px; border-radius: 4px; font-size: 12px; }
    .reply-quote .reply-author { font-weight: bold; color: var(--accent); }

    /* Input Bar */
    .input-bar { padding: 10px 14px; background: var(--bg-sidebar); display: flex; flex-direction: column; gap: 8px; position: relative; }
    .reply-banner { display: none; align-items: center; justify-content: space-between; background: var(--bg-input); padding: 6px 12px; border-radius: 8px; border-left: 3px solid var(--accent); font-size: 13px; }
    .reply-banner .close-btn { cursor: pointer; color: var(--text-sub); }
    
    .input-controls { display: flex; align-items: center; gap: 8px; }
    .input-wrapper { flex: 1; display: flex; align-items: center; background: var(--bg-input); border-radius: 22px; padding: 2px 14px; }
    .input-wrapper input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-main); padding: 10px 0; font-size: 15px; }
    
    .icon-btn { background: none; border: none; color: var(--text-sub); font-size: 19px; cursor: pointer; padding: 8px; transition: 0.2s; border-radius: 50%; }
    .icon-btn:hover { color: var(--accent); background: rgba(255,255,255,0.05); }
    .send-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 17px; transition: 0.2s; flex-shrink: 0; }

    /* Emoji Picker Popover */
    .emoji-picker { position: absolute; bottom: 70px; left: 14px; background: var(--bg-sidebar); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px; display: none; grid-template-columns: repeat(6, 1fr); gap: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); z-index: 1500; max-height: 200px; overflow-y: auto; }
    .emoji-item { font-size: 22px; cursor: pointer; text-align: center; padding: 4px; border-radius: 6px; transition: 0.1s; }
    .emoji-item:hover { background: rgba(255,255,255,0.1); transform: scale(1.2); }

    /* Context Menu */
    .context-menu { position: fixed; background: var(--bg-sidebar); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 2000; display: none; width: 210px; overflow: hidden; padding: 4px 0; }
    .context-menu-item { padding: 10px 16px; font-size: 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; color: var(--text-main); }
    .context-menu-item:hover { background: rgba(82, 136, 193, 0.2); }
    .context-menu-item.delete { color: #ff5252; }

    /* Quick Reactions Panel */
    .context-reactions { display: flex; justify-content: space-around; padding: 8px 10px; border-bottom: 1px solid var(--border-color); background: rgba(0,0,0,0.1); }
    .context-reaction-btn { font-size: 20px; cursor: pointer; transition: transform 0.15s; }
    .context-reaction-btn:hover { transform: scale(1.3); }

    /* Reactions Bar */
    .reactions-bar { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
    .reaction-badge { background: rgba(0,0,0,0.25); padding: 2px 7px; border-radius: 10px; font-size: 11px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }

    /* Modals */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 3000; padding: 16px; }
    .modal-box { background: var(--bg-sidebar); padding: 24px; border-radius: 16px; width: 100%; max-width: 380px; border: 1px solid var(--border-color); position: relative; max-height: 90vh; overflow-y: auto; }
    .modal-box h3 { margin-bottom: 16px; color: var(--text-main); text-align: center; }
    .modal-box input, .modal-box select { width: 100%; padding: 11px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-main); font-size: 14px; margin-bottom: 12px; outline: none; }
    .modal-box button { width: 100%; padding: 11px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }

    /* Profile Avatar Change Circle */
    .avatar-upload-wrapper { width: 90px; height: 90px; margin: 0 auto 16px; position: relative; }
    .avatar-upload-wrapper .avatar { width: 100%; height: 100%; font-size: 32px; border-radius: 50%; }
    .avatar-upload-btn { position: absolute; bottom: 0; right: 0; background: var(--accent); width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer; font-size: 13px; border: 2px solid var(--bg-sidebar); }

    /* Members list in Modal */
    .members-list { margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 12px; }
    .member-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); gap: 8px; }
    .member-info { display: flex; align-items: center; gap: 8px; flex: 1; overflow: hidden; }
    .member-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .member-role { font-size: 10px; color: var(--accent); background: rgba(82, 136, 193, 0.15); padding: 2px 5px; border-radius: 4px; flex-shrink: 0; }
    
    /* Kichik Admin Tugmalari */
    .btn-admin-action { padding: 3px 8px; font-size: 11px; border: none; border-radius: 12px; cursor: pointer; font-weight: 500; transition: 0.2s; flex-shrink: 0; }
    .btn-admin-add { background: var(--accent); color: #fff; }
    .btn-admin-add:hover { opacity: 0.85; }
    .btn-admin-remove { background: rgba(255, 82, 82, 0.2); color: #ff5252; border: 1px solid rgba(255, 82, 82, 0.3); }
    .btn-admin-remove:hover { background: #ff5252; color: #fff; }

    #login-overlay { position: fixed; inset: 0; background: var(--bg-app); display: flex; align-items: center; justify-content: center; z-index: 4000; padding: 16px; }

    /* FULL RESPONSIVE DESIGN */
    @media (max-width: 768px) {
      .sidebar { width: 100%; position: absolute; inset: 0; z-index: 10; }
      .chat-area { width: 100%; position: absolute; inset: 0; z-index: 5; }
      .telegram-app.chat-active .sidebar { transform: translateX(-100%); }
      .telegram-app.chat-active .chat-area { z-index: 15; }
      .back-btn { display: block; }
      .msg { max-width: 85%; }
    }
  </style>
</head>
<body>

  <!-- Kirish Oynasi -->
  <div id="login-overlay">
    <div class="modal-box" style="text-align: center;">
      <h3 style="font-size: 20px; margin-bottom: 8px;">Telegram Web Pro</h3>
      <p style="color: var(--text-sub); font-size: 13px; margin-bottom: 16px;">Tizimga kirish uchun ma'lumotlarni kiriting</p>
      
      <div class="avatar-upload-wrapper">
        <div class="avatar" id="loginAvatarPreview">U</div>
        <label class="avatar-upload-btn" title="Rasm yuklash">
          <i class="fa-solid fa-camera"></i>
          <input type="file" accept="image/*" hidden="" onchange="previewUserAvatar(this)">
        </label>
      </div>

      <input id="userName" type="text" placeholder="Ismingiz..." maxlength="20" autofocus="">
      <input id="userTag" type="text" placeholder="Username (masalan: @bekzod)..." maxlength="20">
      <button onclick="startChat()">Kirish</button>
    </div>
  </div>

  <!-- Foydalanuvchi Shaxsiy Profili Modali -->
  <div class="modal" id="myProfileModal">
    <div class="modal-box">
      <h3>Mening Profilim</h3>
      <div class="avatar-upload-wrapper">
        <div class="avatar" id="myProfileAvatar">U</div>
        <label class="avatar-upload-btn" title="Rasmni o'zgartirish">
          <i class="fa-solid fa-camera"></i>
          <input type="file" accept="image/*" hidden="" onchange="changeMyAvatar(this)">
        </label>
      </div>
      <div style="text-align: center; margin-bottom: 16px;">
        <h4 id="myProfileName" style="font-size: 18px;">...</h4>
        <p id="myProfileTag" style="color: var(--accent); font-size: 14px; margin-top: 2px;">@username</p>
      </div>
      <button onclick="closeModal('myProfileModal')">Yopish</button>
    </div>
  </div>

  <!-- Chat / Kanal Profili va A'zolarni Boshqarish Modali -->
  <div class="modal" id="chatProfileModal">
    <div class="modal-box">
      <h3 id="chatProfileType">Chat Profili</h3>
      <div class="avatar-upload-wrapper">
        <div class="avatar" id="chatProfileAvatar">C</div>
        <label class="avatar-upload-btn" id="chatAvatarUploadBtn" title="Rasmni o'zgartirish">
          <i class="fa-solid fa-camera"></i>
          <input type="file" accept="image/*" hidden="" onchange="changeChatAvatar(this)">
        </label>
      </div>
      <div style="text-align: center; margin-bottom: 16px;">
        <h4 id="chatProfileTitle" style="font-size: 18px;">...</h4>
        <p id="chatProfileSub" style="color: var(--text-sub); font-size: 13px; margin-top: 4px;">...</p>
      </div>

      <!-- Odam Qo'shish Bo'limi -->
      <div style="margin-bottom: 12px;" id="addMemberSection">
        <div style="display: flex; gap: 6px;">
          <input id="newMemberTag" type="text" placeholder="Foydalanuvchi nomi..." style="margin-bottom: 0;">
          <button onclick="addMemberToChat()" style="width: auto; padding: 0 14px; white-space: nowrap; font-size: 13px;">+ Qo'shish</button>
        </div>
      </div>

      <!-- A'zolar Ro'yxati -->
      <div class="members-list">
        <h4 style="font-size: 13px; margin-bottom: 8px; color: var(--text-sub);">A'zolar ro'yxati</h4>
        <div id="membersContainer"></div>
      </div>

      <button onclick="closeModal('chatProfileModal')" style="margin-top: 16px; background: transparent; border: 1px solid var(--border-color);">Yopish</button>
    </div>
  </div>

  <!-- Chat Yaratish Modali -->
  <div class="modal" id="createChatModal">
    <div class="modal-box">
      <h3>Yangi Chat / Kanal</h3>
      <input id="newChatName" type="text" placeholder="Nomi...">
      <select id="newChatType">
        <option value="group">Guruh Chat</option>
        <option value="channel">Kanal (Faqat siz yozasiz)</option>
      </select>
      <button onclick="createNewChat()">Yaratish</button>
      <button onclick="closeModal('createChatModal')" style="background: transparent; color: var(--text-sub); margin-top: 6px;">Bekor qilish</button>
    </div>
  </div>

  <!-- Context Menu -->
  <div class="context-menu" id="contextMenu" style="display: none;">
    <div class="context-reactions">
      <span class="context-reaction-btn" onclick="reactMessage('👍')">👍</span>
      <span class="context-reaction-btn" onclick="reactMessage('❤️')">❤️</span>
      <span class="context-reaction-btn" onclick="reactMessage('😂')">😂</span>
      <span class="context-reaction-btn" onclick="reactMessage('🔥')">🔥</span>
      <span class="context-reaction-btn" onclick="reactMessage('😮')">😮</span>
    </div>
    <div class="context-menu-item" onclick="replyMessage()"><i class="fa-solid fa-reply"></i> Javob berish</div>
    <div class="context-menu-item" onclick="editMessage()"><i class="fa-solid fa-pen"></i> Tahrirlash</div>
    <div class="context-menu-item delete" onclick="deleteMessage()"><i class="fa-solid fa-trash"></i> O'chirish</div>
  </div>

  <!-- Asosiy Telegram ilovasi -->
  <div class="telegram-app" id="telegramApp">
    
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="my-profile-btn" onclick="openMyProfile()">
          <div class="avatar small" id="myHeaderAvatar">U</div>
        </div>

        <div style="display:flex; gap:4px; align-items:center;">
          <button class="icon-btn" onclick="toggleTheme()" title="Tungi/Kungi rejim">
            <i class="fa-solid fa-moon" id="themeIcon"></i>
          </button>
          <button class="icon-btn" onclick="openBgPicker()" title="Fon rasmi">
            <i class="fa-solid fa-image"></i>
          </button>
          <input type="file" id="bgInput" hidden="" accept="image/*" onchange="changeBackground(this)">
          <button class="icon-btn" onclick="openModal('createChatModal')" title="Qo'shish">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>
      </div>

      <!-- Qidiruv Bo'limi -->
      <div class="search-container">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Qidirish..." oninput="filterChats()">
        </div>
      </div>

      <div class="chats-list" id="chatsContainer"></div>
    </div>

    <!-- Chat Sohasi -->
    <div class="chat-area">
      <div class="chat-header">
        <div class="chat-header-info" onclick="openChatProfile()">
          <button class="back-btn" onclick="backToSidebar(event)"><i class="fa-solid fa-arrow-left"></i></button>
          <div class="avatar" id="activeAvatar">S</div>
          <div>
            <div class="title" id="activeTitle">Sinf Guruhi</div>
            <div class="sub" id="activeSub">profilni ko'rish uchun bosing</div>
          </div>
        </div>
      </div>

      <!-- Xabarlar oynasi -->
      <div class="messages-container" id="messagesBox"></div>

      <!-- Input Bar -->
      <div class="input-bar">
        <div class="reply-banner" id="replyBanner">
          <div>
            <div style="font-size: 11px; color: var(--accent); font-weight: 600;" id="bannerTitle">Javob berilmoqda</div>
            <div id="bannerText" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; color: var(--text-sub);">...</div>
          </div>
          <i class="fa-solid fa-xmark close-btn" onclick="cancelAction()"></i>
        </div>

        <div class="emoji-picker" id="emojiPicker" style="display: none;"></div>

        <div class="input-controls" id="inputControls">
          <button class="icon-btn" onclick="toggleEmojiPicker()"><i class="fa-regular fa-face-smile"></i></button>
          
          <input type="file" id="fileInput" hidden="" onchange="sendFile(this.files[0])">
          <button class="icon-btn" onclick="document.getElementById('fileInput').click()"><i class="fa-solid fa-paperclip"></i></button>
          
          <div class="input-wrapper">
            <input type="text" id="messageInput" placeholder="Xabar yozing..." autocomplete="off">
          </div>

          <button class="send-btn" onclick="handleSend()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let myName = '';
    let myTag = '';
    let myAvatarUrl = '';

    let currentChatId = 'main';
    let selectedMsgId = null;
    let actionState = null; 
    
    const availableEmojis = ['😊', '😂', '🥰', '😍', '😎', '👍', '❤️', '🔥', '🎉', '🙌', '😭', '🤔', '👏', '🙏', '💯', '✨', '🤩', '💩'];

    let chats = [
      { id: 'main', name: 'Sinf Guruhi', type: 'group', avatar: '', initial: 'S', owner: 'admin', admins: ['admin'], members: ['admin'] },
      { id: 'news', name: 'Sinf Yangiliklari', type: 'channel', avatar: '', initial: 'Y', owner: 'admin', admins: ['admin'], members: ['admin'] }
    ];

    let messages = {
      'main': [],
      'news': []
    };

    function previewUserAvatar(input) {
      if (input.files && input.files[0]) {
        myAvatarUrl = URL.createObjectURL(input.files[0]);
        const prev = document.getElementById('loginAvatarPreview');
        prev.style.backgroundImage = `url('${myAvatarUrl}')`;
        prev.textContent = '';
      }
    }

    function startChat() {
      const name = document.getElementById('userName').value.trim();
      let tag = document.getElementById('userTag').value.trim();
      
      if (!name) {
        alert("Iltimos, ismingizni kiriting!");
        return;
      }
      if (!tag) {
        alert("Iltimos, username kiriting!");
        return;
      }

      if (!tag.startsWith('@')) tag = '@' + tag;

      myName = name;
      myTag = tag;

      chats.forEach(c => {
        if (!c.members.includes(myName)) c.members.push(myName);
      });

      document.getElementById('login-overlay').style.display = 'none';
      
      updateMyAvatarDisplay();
      initEmojiPicker();
      renderChats();
      selectChat('main');
    }

    function updateMyAvatarDisplay() {
      const headerAv = document.getElementById('myHeaderAvatar');
      const profileAv = document.getElementById('myProfileAvatar');
      
      [headerAv, profileAv].forEach(el => {
        if (myAvatarUrl) {
          el.style.backgroundImage = `url('${myAvatarUrl}')`;
          el.textContent = '';
        } else {
          el.style.backgroundImage = 'none';
          el.textContent = myName[0].toUpperCase();
        }
      });
    }

    function openMyProfile() {
      document.getElementById('myProfileName').textContent = myName;
      document.getElementById('myProfileTag').textContent = myTag;
      openModal('myProfileModal');
    }

    function changeMyAvatar(input) {
      if (input.files && input.files[0]) {
        myAvatarUrl = URL.createObjectURL(input.files[0]);
        updateMyAvatarDisplay();
      }
    }

    function openChatProfile() {
      const chat = chats.find(c => c.id === currentChatId);
      if (!chat) return;

      document.getElementById('chatProfileType').textContent = chat.type === 'channel' ? 'Kanal Profili' : 'Guruh Profili';
      document.getElementById('chatProfileTitle').textContent = chat.name;
      document.getElementById('chatProfileSub').textContent = `${chat.type === 'channel' ? 'Kanal' : 'Guruh'} • ${chat.members.length} ta a'zo`;

      const av = document.getElementById('chatProfileAvatar');
      if (chat.avatar) {
        av.style.backgroundImage = `url('${chat.avatar}')`;
        av.textContent = '';
      } else {
        av.style.backgroundImage = 'none';
        av.textContent = chat.initial;
      }

      renderMembersList(chat);
      openModal('chatProfileModal');
    }

    function renderMembersList(chat) {
      const container = document.getElementById('membersContainer');
      container.innerHTML = '';

      const isAdminOrOwner = chat.owner === myName || chat.admins.includes(myName);

      chat.members.forEach(member => {
        const isOwner = member === chat.owner;
        const isAdmin = chat.admins.includes(member);

        let roleBadge = isOwner ? '<span class="member-role">Ega</span>' : (isAdmin ? '<span class="member-role">Admin</span>' : '');
        let adminActionBtn = '';

        if (isAdminOrOwner && !isOwner) {
          if (isAdmin) {
            adminActionBtn = `<button class="btn-admin-action btn-admin-remove" onclick="removeAdmin('${member}')">Admindan olish</button>`;
          } else {
            adminActionBtn = `<button class="btn-admin-action btn-admin-add" onclick="makeAdmin('${member}')">Admin qilish</button>`;
          }
        }

        container.innerHTML += `
          <div class="member-item">
            <div class="member-info">
              <div class="avatar small" style="width:28px; height:28px; font-size:12px;">${member[0].toUpperCase()}</div>
              <div class="member-name">${member}</div>
              ${roleBadge}
            </div>
            ${adminActionBtn}
          </div>
        `;
      });
    }

    function addMemberToChat() {
      const input = document.getElementById('newMemberTag');
      let memberName = input.value.trim();
      if (!memberName) return;

      if (memberName.startsWith('@')) memberName = memberName.substring(1);

      const chat = chats.find(c => c.id === currentChatId);
      if (chat) {
        if (!chat.members.includes(memberName)) {
          chat.members.push(memberName);
          input.value = '';
          renderMembersList(chat);
          document.getElementById('chatProfileSub').textContent = `${chat.type === 'channel' ? 'Kanal' : 'Guruh'} • ${chat.members.length} ta a'zo`;
        } else {
          alert("Bu foydalanuvchi allaqachon a'zo!");
        }
      }
    }

    function makeAdmin(memberName) {
      const chat = chats.find(c => c.id === currentChatId);
      if (chat && !chat.admins.includes(memberName)) {
        chat.admins.push(memberName);
        renderMembersList(chat);
        selectChat(currentChatId);
      }
    }

    function removeAdmin(memberName) {
      const chat = chats.find(c => c.id === currentChatId);
      if (chat) {
        chat.admins = chat.admins.filter(a => a !== memberName);
        renderMembersList(chat);
        selectChat(currentChatId);
      }
    }

    function changeChatAvatar(input) {
      if (input.files && input.files[0]) {
        const url = URL.createObjectURL(input.files[0]);
        const chat = chats.find(c => c.id === currentChatId);
        if (chat) {
          chat.avatar = url;
          const av = document.getElementById('chatProfileAvatar');
          av.style.backgroundImage = `url('${url}')`;
          av.textContent = '';
          
          renderChats();
          selectChat(chat.id);
        }
      }
    }

    function initEmojiPicker() {
      const picker = document.getElementById('emojiPicker');
      picker.innerHTML = '';
      availableEmojis.forEach(emoji => {
        const span = document.createElement('span');
        span.className = 'emoji-item';
        span.textContent = emoji;
        span.onclick = () => {
          const inp = document.getElementById('messageInput');
          inp.value += emoji;
          inp.focus();
        };
        picker.appendChild(span);
      });
    }

    function toggleEmojiPicker() {
      const picker = document.getElementById('emojiPicker');
      picker.style.display = picker.style.display === 'grid' ? 'none' : 'grid';
    }

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      const icon = document.getElementById('themeIcon');
      icon.className = document.body.classList.contains('light-mode') ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    }

    function openBgPicker() { document.getElementById('bgInput').click(); }

    function changeBackground(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const box = document.getElementById('messagesBox');
          box.style.backgroundImage = `url('${e.target.result}')`;
          box.style.backgroundSize = 'cover';
          box.style.backgroundPosition = 'center';
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function filterChats() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      renderChats(query);
    }

    function renderChats(filterQuery = '') {
      const container = document.getElementById('chatsContainer');
      container.innerHTML = '';
      
      const filtered = chats.filter(c => c.name.toLowerCase().includes(filterQuery));

      if (filtered.length === 0) {
        container.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--text-sub); font-size: 14px;">Chatlar topilmadi</div>`;
        return;
      }

      filtered.forEach(c => {
        const avatarStyle = c.avatar ? `style="background-image: url('${c.avatar}')"` : '';
        const avatarText = c.avatar ? '' : c.initial;

        container.innerHTML += `
          <div class="chat-item ${c.id === currentChatId ? 'active' : ''}" onclick="selectChat('${c.id}')">
            <div class="avatar" ${avatarStyle}>${avatarText}</div>
            <div class="chat-info">
              <div class="name">
                ${c.name}
                <span class="type-tag">${c.type === 'channel' ? 'Kanal' : 'Guruh'}</span>
              </div>
              <div class="status">${c.type === 'channel' ? 'Kanal xabarlari' : 'Guruh muloqoti'}</div>
            </div>
          </div>`;
      });
    }

    function selectChat(id) {
      currentChatId = id;
      renderChats(document.getElementById('searchInput').value.toLowerCase());
      const chat = chats.find(c => c.id === id);
      
      document.getElementById('activeTitle').textContent = chat.name;
      const activeAv = document.getElementById('activeAvatar');
      
      if (chat.avatar) {
        activeAv.style.backgroundImage = `url('${chat.avatar}')`;
        activeAv.textContent = '';
      } else {
        activeAv.style.backgroundImage = 'none';
        activeAv.textContent = chat.initial;
      }

      const inputControls = document.getElementById('inputControls');
      
      const canWrite = chat.type !== 'channel' || chat.owner === myName || chat.admins.includes(myName) || chat.owner === 'admin';

      if (!canWrite) {
        inputControls.style.display = 'none';
        document.getElementById('activeSub').textContent = 'Faqat kanal adminlari yozishi mumkin';
      } else {
        inputControls.style.display = 'flex';
        document.getElementById('activeSub').textContent = 'profilni ko\'rish uchun bosing';
      }

      document.getElementById('telegramApp').classList.add('chat-active');
      renderMessages();
    }

    function backToSidebar(e) {
      if (e) e.stopPropagation();
      document.getElementById('telegramApp').classList.remove('chat-active');
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function createNewChat() {
      const name = document.getElementById('newChatName').value.trim();
      const type = document.getElementById('newChatType').value;
      if (!name) return;

      const id = 'chat_' + Date.now();
      chats.push({ 
        id, 
        name, 
        type, 
        avatar: '', 
        initial: name[0].toUpperCase(), 
        owner: myName,
        admins: [myName],
        members: [myName]
      });
      
      messages[id] = [];
      closeModal('createChatModal');
      document.getElementById('newChatName').value = '';
      renderChats();
      selectChat(id);
    }

    function renderMessages() {
      const box = document.getElementById('messagesBox');
      box.innerHTML = '';
      const currentMsgs = messages[currentChatId] || [];
      const chat = chats.find(c => c.id === currentChatId);

      currentMsgs.forEach(d => {
        d.views = (d.views || 0) + 1;

        const isMe = d.senderName === myName;
        const dt = new Date(d.time);
        const timeStr = ('0' + dt.getHours()).slice(-2) + ':' + ('0' + dt.getMinutes()).slice(-2);

        const div = document.createElement('div');
        div.className = `msg ${isMe ? 'me' : ''}`;
        div.id = `msg-${d.id}`;
        
        div.oncontextmenu = (e) => showContextMenu(e, d.id);

        let replyHTML = '';
        if (d.replyTo) {
          replyHTML = `
            <div class="reply-quote">
              <div class="reply-author">${d.replyTo.name}</div>
              <div>${d.replyTo.text}</div>
            </div>`;
        }

        let reactionsHTML = '';
        if (d.userReactions && Object.keys(d.userReactions).length > 0) {
          const counts = {};
          Object.values(d.userReactions).forEach(emoji => {
            counts[emoji] = (counts[emoji] || 0) + 1;
          });

          reactionsHTML = '<div class="reactions-bar">';
          for (const [emoji, count] of Object.entries(counts)) {
            reactionsHTML += `<span class="reaction-badge">${emoji} ${count}</span>`;
          }
          reactionsHTML += '</div>';
        }

        const displayName = chat.type === 'channel' ? chat.name : d.senderName;

        div.innerHTML = `
          <div class="msg-author">${displayName}</div>
          ${replyHTML}
          <div>${d.text}</div>
          ${reactionsHTML}
          <div class="msg-meta">
            ${d.isEdited ? '<span class="edited-mark">tahrirlandi</span>' : ''}
            <span><i class="fa-regular fa-eye"></i> ${d.views}</span>
            <span>${timeStr}</span>
          </div>
        `;

        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    function handleSend() {
      const inp = document.getElementById('messageInput');
      const text = inp.value.trim();
      if (!text) return;

      const chatMsgs = messages[currentChatId];

      if (actionState === 'edit') {
        const msg = chatMsgs.find(m => m.id === selectedMsgId);
        if (msg) {
          msg.text = text;
          msg.isEdited = true;
        }
      } else {
        let replyData = null;
        if (actionState === 'reply') {
          const parentMsg = chatMsgs.find(m => m.id === selectedMsgId);
          if (parentMsg) {
            replyData = { name: parentMsg.senderName, text: parentMsg.text };
          }
        }

        chatMsgs.push({
          id: 'msg_' + Date.now(),
          senderName: myName,
          text: text,
          time: new Date(),
          views: 0,
          userReactions: {},
          replyTo: replyData,
          isEdited: false
        });
      }

      inp.value = '';
      document.getElementById('emojiPicker').style.display = 'none';
      cancelAction();
      renderMessages();
    }

    const contextMenu = document.getElementById('contextMenu');

    function showContextMenu(e, msgId) {
      e.preventDefault();
      selectedMsgId = msgId;
      contextMenu.style.display = 'block';
      
      let left = e.pageX;
      let top = e.pageY;
      if (left + 210 > window.innerWidth) left = window.innerWidth - 220;
      if (top + 200 > window.innerHeight) top = window.innerHeight - 210;

      contextMenu.style.left = left + 'px';
      contextMenu.style.top = top + 'px';
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.context-menu')) {
        contextMenu.style.display = 'none';
      }
      if (!e.target.closest('.emoji-picker') && !e.target.closest('.fa-face-smile')) {
        document.getElementById('emojiPicker').style.display = 'none';
      }
    });

    function replyMessage() {
      actionState = 'reply';
      const msg = messages[currentChatId].find(m => m.id === selectedMsgId);
      document.getElementById('bannerTitle').textContent = 'Javob berilmoqda';
      document.getElementById('bannerText').textContent = `${msg.senderName}: ${msg.text}`;
      document.getElementById('replyBanner').style.display = 'flex';
      document.getElementById('messageInput').focus();
    }

    function editMessage() {
      const msg = messages[currentChatId].find(m => m.id === selectedMsgId);
      if (msg.senderName !== myName) {
        alert("Faqat o'zingizning xabaringizni tahrirlashingiz mumkin!");
        return;
      }
      actionState = 'edit';
      document.getElementById('bannerTitle').textContent = 'Tahrirlanmoqda';
      document.getElementById('bannerText').textContent = msg.text;
      document.getElementById('replyBanner').style.display = 'flex';
      
      const inp = document.getElementById('messageInput');
      inp.value = msg.text;
      inp.focus();
    }

    function reactMessage(emoji) {
      const msg = messages[currentChatId].find(m => m.id === selectedMsgId);
      if (msg) {
        if (!msg.userReactions) msg.userReactions = {};
        
        if (msg.userReactions[myName] === emoji) {
          delete msg.userReactions[myName];
        } else {
          msg.userReactions[myName] = emoji;
        }
        renderMessages();
      }
      contextMenu.style.display = 'none';
    }

    function deleteMessage() {
      messages[currentChatId] = messages[currentChatId].filter(m => m.id !== selectedMsgId);
      renderMessages();
    }

    function cancelAction() {
      actionState = null;
      selectedMsgId = null;
      document.getElementById('replyBanner').style.display = 'none';
      document.getElementById('messageInput').value = '';
    }

    function sendFile(file) {
      if (!file) return;
      const fileUrl = URL.createObjectURL(file);
      const isImage = file.type.startsWith('image/');

      let content = isImage ? 
        `<img src="${fileUrl}" style="max-width:100%; border-radius:8px;">` : 
        `<a href="${fileUrl}" target="_blank" style="color:var(--accent); text-decoration:none;"><i class="fa-solid fa-file"></i> ${file.name}</a>`;

      messages[currentChatId].push({
        id: 'msg_' + Date.now(),
        senderName: myName,
        text: content,
        time: new Date(),
        views: 0,
        userReactions: {},
        replyTo: null,
        isEdited: false
      });
      renderMessages();
    }

    document.getElementById('userName').addEventListener('keydown', (e) => { if (e.key === 'Enter') startChat(); });
    document.getElementById('userTag').addEventListener('keydown', (e) => { if (e.key === 'Enter') startChat(); });
    document.getElementById('messageInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSend(); });
  </script>

</body></html>
